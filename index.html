<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>材料库存卡</title>
    <!-- 引入条形码专用库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
    <style>
        /* 1. 全局复位 */
        * { box-sizing: border-box; }
        body { 
            font-family: "SimHei", "黑体", sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: white;
            color: black;
            font-size: 14px; 
        }
        /* 2. 打印容器 */
        .sheet-container {
            max-width: 210mm; /* A4 宽度 */
            margin: 0 auto;
            position: relative;
        }
        /* 3. 头部区域 */
        .header {
            text-align: center;
            margin-bottom: 10px;
            position: relative;
            padding-top: 10px;
            min-height: 100px;
        }
        /* Logo：绝对定位在左上角 */
        .logo-img {
            position: absolute;
            top: 5px;
            left: 0;
            height: 45px; 
            width: auto;
        }
        
        /* ✨ 新增：Logo下方备注容器样式 ✨ */
        .logo-remark {
            position: absolute;
            top: 55px; /* 在高度45px的Logo下方留出一点空隙 */
            left: 0;
            font-size: 13px;
            font-weight: bold; /* 加粗显示更显眼 */
            color: #333;
            text-align: left;
            width: 200px; /* 限制宽度，防止与中间标题重叠 */
        }
        /* 条形码：定位在右上角 */
        .barcode-svg {
            position: absolute;
            top: 0;
            right: 0;
            max-height: 45px;
        }
        /* 标题 */
        .company-title {
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 0 0 10px 0;
        }
        .card-name {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 5px;
            margin: 0;
        }
        /* 4. 表格样式 */
        table {
            width: 100%;
            border-collapse: collapse;
            border-spacing: 0;
            border: 1px solid #000;
            table-layout: fixed; /* 保持表格列宽固定 */
        }
        th, td {
            border: 1px solid #000;
            text-align: center;
            vertical-align: middle;
            font-weight: normal;
            padding: 4px 2px; 
            
            /* ✨ 核心修复：强制长文本自动换行，防止文字重叠 ✨ */
            word-wrap: break-word;
            word-break: break-all;
            white-space: normal;
        }
        
        /* 消除两个表格之间的双重边框 */
        .info-table { border-bottom: none; }
        .info-table td { height: 35px; }
        .record-table { border-top: none; }
        .record-table td { height: 28px; }
        /* 底部签字栏 */
        .footer-signatures {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 15px;
            padding: 0 30px;
        }
        /* 5. 打印适配 */
        @media print {
            .no-print { display: none !important; }
            body { padding: 0; margin: 0; }
            .sheet-container { width: 100%; max-width: 100%; }
        }
    </style>
</head>
<body>
<div class="sheet-container">
    <!-- 头部区域 -->
    <div class="header">
        <img src="logo.jpg" alt="Logo" class="logo-img">
        
        <!-- ✨ 新增：预留给左上角备注的空白 <div> ✨ -->
        <div id="logo_remark" class="logo-remark"></div>
        
        <h1 class="company-title">温州博江管件有限公司</h1>
        <div class="card-name">材 料 库 存 卡</div>
        <!-- 右上角条形码 -->
        <svg id="barcode" class="barcode-svg"></svg>
    </div>
    <!-- 第一部分：产品基础信息 -->

        </tbody>
        <tfoot>

    </table>
    <!-- 第三部分：底部签字栏 -->
